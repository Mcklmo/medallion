# AUTO-GENERATED from config.yml by generate_compose.py — do not edit by hand.
# Stores are synthesised (one per queue); any stores: block in the
# config is ignored. Edit the config or the generator, then regenerate.
services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-dev
    ports:
    - 8085:8085
  bootstrap:
    image: curlimages/curl:8.7.1
    depends_on:
    - pubsub
    environment:
      PUBSUB_EMULATOR_HOST: http://pubsub:8085
      PUBSUB_PROJECT_ID: local-dev
    entrypoint:
    - sh
    - -c
    - 'set -e

      echo "waiting for emulator..."

      until curl -s $${PUBSUB_EMULATOR_HOST}/v1/projects/$${PUBSUB_PROJECT_ID}/topics
      -o /dev/null; do sleep 1; done

      curl -s -X PUT $${PUBSUB_EMULATOR_HOST}/v1/projects/$${PUBSUB_PROJECT_ID}/topics/nemweb-dispatch-scada-raw-dispatch-scada-csv-files
      -o /dev/null && echo "topic nemweb-dispatch-scada-raw-dispatch-scada-csv-files"

      curl -s -X PUT $${PUBSUB_EMULATOR_HOST}/v1/projects/$${PUBSUB_PROJECT_ID}/subscriptions/nemweb-dispatch-scada-raw-dispatch-scada-csv-files-store-raw-dispatch-scada-csv-files
      -H "Content-Type: application/json" -d "{\"topic\": \"projects/$${PUBSUB_PROJECT_ID}/topics/nemweb-dispatch-scada-raw-dispatch-scada-csv-files\"}"
      -o /dev/null && echo "sub nemweb-dispatch-scada-raw-dispatch-scada-csv-files-store-raw-dispatch-scada-csv-files"

      echo "bootstrap done"'
  extract-nemweb-dispatch-scada:
    build: .
    command: python -m medallion.run.extractor
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-dev
      MEDALLION_ROOT: /app/src
      FILE_STORAGE_TYPE: local
      MEDALLION_CONCURRENCY: 10
      MEDALLION_MAX_INSTANCES: 1
      MEDALLION_MIN_INSTANCES: 0
      MEDALLION_TIMEOUT: 1800s
      FORCE_RUN_EXTRACTOR: true
      EXTRACTOR_CLASS: DispatchScadaExtractor
      MEDALLION_TOPIC: nemweb-dispatch-scada-raw-dispatch-scada-csv-files
      LOCAL_OUTPUT_DIR: /app/data
    ports:
    - 8001:8080
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
    - ./.medallion-data:/app/data
    labels:
      medallion.schedules: peak-hours=0/10 12 * * * (Europe/Copenhagen)
  store-raw-dispatch-scada-csv-files:
    build: .
    command: python -m medallion.run.store
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-dev
      MEDALLION_ROOT: /app/src
      FILE_STORAGE_TYPE: local
      MEDALLION_CONCURRENCY: 10
      MEDALLION_MAX_INSTANCES: 10
      MEDALLION_MIN_INSTANCES: 0
      MEDALLION_TIMEOUT: 300s
      MEDALLION_SUBSCRIPTION: nemweb-dispatch-scada-raw-dispatch-scada-csv-files-store-raw-dispatch-scada-csv-files
      LOCAL_OUTPUT_DIR: /app/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
    - ./.medallion-data:/app/data
