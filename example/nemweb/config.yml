apiVersion: medallion/v1
repo:
  name: nemweb-dispatch-scada
  owner: team-data-ingest
  description: Scrapes dispatch SCADA data from NEMWEB

# ---------------------------------------------------------------
# Defaults applied to all processors unless overridden per-processor.
# ---------------------------------------------------------------
defaults:
  runtime:
    cpu: 1
    memory: 512Mi
    timeout: 300s
    min_instances: 0
    max_instances: 10
    concurrency: 10

schemas:
  - name: FileOutput
  - name: DispatchScadaModel

queues:
  - name: raw-dispatch-scada-csv-files
    schema: FileOutput
  - name: processed-dispatch-scada-data
    schema: DispatchScadaModel

extractors:
  - name: nemweb-dispatch-scada
    class: DispatchScadaExtractor
    writes_to: raw-dispatch-scada-csv-files
    schedules:
      - name: peak-hours
        cron: "0/10 12 * * *"    
        timezone: Europe/Copenhagen
    runtime:
      # Scraping is I/O-bound and can be long-running; override defaults.
      timeout: 1800s
      memory: 1Gi
      max_instances: 1 # be polite to the target site

transformers:
  - name: dispatch-scada-csv-to-model
    class: DispatchScadaTransformer
    reads_from: raw-dispatch-scada-csv-files
    writes_to: processed-dispatch-scada-data
    runtime:
      # Normalization is CPU-bound and fast; tune for throughput.
      concurrency: 50
      max_instances: 20
      min_instances: 1 # keep one warm — avoids cold-start latency on bursts
