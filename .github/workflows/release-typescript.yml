name: Release to npm

on:
  push:
    tags:
      - "ts-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1, which current Node 24 bundles.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#ts-v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Publish to npm unless the version is already there
        run: |
          SPEC=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if [ -n "$(npm view "$SPEC" version 2>/dev/null)" ]; then
            echo "$SPEC is already on npm, skipping"
          else
            npm publish
          fi
